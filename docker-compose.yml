services:
  api:
    build:
      context: .
      dockerfile: src/EkoaGym.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=EkoaGym;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      - sqlserver
    volumes:
      - api_uploads:/app/uploads
    networks:
      - ekoagym-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - ekoagym-network

networks:
  ekoagym-network:

volumes:
  mssql_data:
  api_uploads:
